<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
</head>
<body>
    <h1>Register</h1>
    <form th:action="@{/register}" method="post">
        <div><label>Username: <input type="text" name="username" required/></label></div>
        <div><label>Email: <input type="email" name="email" required/></label></div>
        <div><label>Phone: <input type="text" name="phoneNumber" required/></label></div>
        <div><label>Password: <input type="password" name="password" required minlength="8"/></label></div>
        <div><input type="submit" value="Register"/></div>
    </form>
</body>
</html>
